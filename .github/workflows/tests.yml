name: Tests Python

on:
  push:
    branches:
      - web-app
      - feature/admin-dashboard
  pull_request:
    branches:
      - web-app
      - feature/admin-dashboard

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Exécuter les tests
        run: python -m pytest -q
