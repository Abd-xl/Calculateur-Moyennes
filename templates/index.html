<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de moyennes</title>
</head>
<body>
    <h1>Calculateur de moyennes</h1>

    <form method="POST">
        <label for="matiere">Matière :</label>
        <input type="text" id="matiere" name="matiere" required>

        <label for="coefficient">Coefficient :</label>
        <input type="number" id="coefficient" name="coefficient" min="1" step="1" required>

        <label for="note">Note :</label>
        <input type="number" id="note" name="note" min="0" max="20" step="0.01" required>

        <button type="submit">Ajouter la note</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    {% for matiere, liste_notes in notes.items() %}
        <h2>{{ matiere }} (coefficient {{ coef[matiere] }})</h2>

        {% for note in liste_notes %}
            <p>{{ note }}/20</p>
        {% endfor %}
    {% endfor %}
</body>
</html>
