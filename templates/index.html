<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de moyennes</title>
</head>
<body>
    <h1>Calculateur de moyennes</h1>

    {% for matiere, liste_notes in notes.items() %}
        <h2>{{ matiere }}</h2>

        {% for note in liste_notes %}
            <p>{{ note }}/20</p>
        {% endfor %}
    {% endfor %}
</body>
</html>
