<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une note</title>
</head>
<body>
    <header>
        <h1>Ajouter une note</h1>
        <a href="{{ url_for('accueil') }}">Retour</a>
    </header>

    <main>
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('ajouter') }}">
            <label for="matiere">Matière :</label>
            <input type="text" id="matiere" name="matiere" required>

            <label for="coefficient">Coefficient :</label>
            <input type="number" id="coefficient" name="coefficient" min="1" step="1" required>

            <label for="note">Note :</label>
            <input type="number" id="note" name="note" min="0" max="20" step="0.01" required>

            <button type="submit">Ajouter la note</button>
        </form>
    </main>
</body>
</html>
