<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une note</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="app-header__inner">
            <div class="page-header">
                <div>
                    <p class="page-eyebrow">Saisie</p>
                    <h1>Ajouter une note</h1>
                </div>
                <a class="back-action" href="{{ url_for('accueil') }}">← Accueil</a>
            </div>
        </div>
    </header>

    <main>
        <section class="form-card">
            {% if message %}
                <div class="message">{{ message }}</div>
            {% endif %}

            <form class="app-form" method="POST" action="{{ url_for('ajouter') }}">
                <div class="form-field">
                    <label for="matiere">Matière</label>
                    <input type="text" id="matiere" name="matiere" required>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="coefficient">Coefficient</label>
                        <input type="number" id="coefficient" name="coefficient" min="1" step="1" required>
                    </div>

                    <div class="form-field">
                        <label for="note">Note</label>
                        <input type="number" id="note" name="note" min="0" max="20" step="0.01" required>
                    </div>
                </div>

                <button class="form-submit" type="submit">Ajouter la note</button>
            </form>
        </section>
    </main>
</body>
</html>
